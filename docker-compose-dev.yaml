name: TP Escalabilidad - Coffee Shop Analysis
services:
  supervisor1:
    container_name: supervisor1
    image: supervisor:latest
    entrypoint: python3 /supervisor/main.py
    environment:
      - SUPERVISOR_ID=1
      - SUPERVISOR_PEERS=1:supervisor1:6000,2:supervisor2:6000
    networks:
      - testing_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./supervisor/config.ini:/config.ini:ro

  supervisor2:
    container_name: supervisor2
    image: supervisor:latest
    entrypoint: python3 /supervisor/main.py
    environment:
      - SUPERVISOR_ID=2
      - SUPERVISOR_PEERS=1:supervisor1:6000,2:supervisor2:6000
    networks:
      - testing_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./supervisor/config.ini:/config.ini:ro

  middleware:
    container_name: middleware
    build:
      context: ./middleware
      dockerfile: Dockerfile
    ports:
      - '15672:15672'
    networks:
      - testing_net
    volumes:
      - ./middleware/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  results1:
    container_name: results1
    image: results:latest
    entrypoint: python3 /results/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - DIR_PATH=/storage
      - PORT=12349
      - NODE_ID=1
    networks:
      - testing_net
    depends_on:
      - middleware
    volumes:
      - ./results/config.ini:/config.ini:ro
      - ./.data/storage/results_1:/results/storage

  results2:
    container_name: results2
    image: results:latest
    entrypoint: python3 /results/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - DIR_PATH=/storage
      - PORT=12350
      - NODE_ID=2
    networks:
      - testing_net
    depends_on:
      - middleware
    volumes:
      - ./results/config.ini:/config.ini:ro
      - ./.data/storage/results_2:/results/storage

  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /server/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - DISPATCHERS=dispatcher1:12347,dispatcher2:12348
      - RESULTS_STORAGES=results1:12349,results2:12350
    networks:
      - testing_net
    depends_on:
      - dispatcher1
      - dispatcher2
    volumes:
      - ./server/config.ini:/config.ini:ro

  client1:
    container_name: client1
    image: client:latest
    entrypoint: python3 /client/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - INPUT_DIR=/input
      - OUTPUT_DIR=/output
      - EXECUTIONS=1
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.ini:/config.ini:ro
      - ./.data/archive:/input:ro
      - ./.data/results/client1:/output:rw

  client2:
    container_name: client2
    image: client:latest
    entrypoint: python3 /client/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - INPUT_DIR=/input
      - OUTPUT_DIR=/output
      - EXECUTIONS=1
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.ini:/config.ini:ro
      - ./.data/archive:/input:ro
      - ./.data/results/client2:/output:rw
      
  dispatcher1:
    container_name: dispatcher1
    image: dispatcher:latest
    entrypoint: python3 /dispatcher/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=12347
      - NODE_ID=1
    networks:
      - testing_net
    depends_on:
      - middleware
    volumes:
      - ./dispatcher/config.ini:/config.ini:ro
      - ./.data/profiling/dispatcher1.prof:/etc/profiling/profile.prof
      - ./.data/states/:/etc/node_state

  dispatcher2:
    container_name: dispatcher2
    image: dispatcher:latest
    entrypoint: python3 /dispatcher/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=12348
      - NODE_ID=2
    networks:
      - testing_net
    depends_on:
      - middleware
    volumes:
      - ./dispatcher/config.ini:/config.ini:ro
      - ./.data/profiling/dispatcher2.prof:/etc/profiling/profile.prof
      - ./.data/states/:/etc/node_state

  resultnode1:
    container_name: resultnode1
    image: resultnode:latest
    entrypoint: python3 /resultnode/main.py
    environment:
      - RESULT_NODE_ID=1
      - RESULTS_STORAGES_COUNT=2
    networks:
      - testing_net
    depends_on:
      - middleware
      - results1
      - results2
    volumes:
      - ./resultnode/config.ini:/config.ini:ro
      - ./.data/profiling/resultnode1.prof:/etc/profiling/profile.prof
      - ./.data/states/:/etc/node_state


  selectnode1:
    container_name: selectnode1
    image: selectnode:latest
    entrypoint: python3 /selectnode/main.py
    environment:
      - SELECT_NODE_ID=1
      - GROUPBY_NODE_COUNT=2
      - JOIN_NODE_COUNT=2
    networks:
      - testing_net
    depends_on:
      - middleware
    links:
      - middleware
    volumes:
      - ./selectnode/config.ini:/config.ini:ro
      - ./.data/profiling/selectnode1.prof:/etc/profiling/profile.prof

  selectnode2:
    container_name: selectnode2
    image: selectnode:latest
    entrypoint: python3 /selectnode/main.py
    environment:
      - SELECT_NODE_ID=2
      - GROUPBY_NODE_COUNT=2
      - JOIN_NODE_COUNT=2
    networks:
      - testing_net
    depends_on:
      - middleware
    links:
      - middleware
    volumes:
      - ./selectnode/config.ini:/config.ini:ro
      - ./.data/profiling/selectnode2.prof:/etc/profiling/profile.prof

  selectnode3:
    container_name: selectnode3
    image: selectnode:latest
    entrypoint: python3 /selectnode/main.py
    environment:
      - SELECT_NODE_ID=3
      - GROUPBY_NODE_COUNT=2
      - JOIN_NODE_COUNT=2
    networks:
      - testing_net
    depends_on:
      - middleware
    links:
      - middleware
    volumes:
      - ./selectnode/config.ini:/config.ini:ro
      - ./.data/profiling/selectnode3.prof:/etc/profiling/profile.prof

  groupbynode1:
    container_name: groupbynode1
    image: groupbynode:latest
    entrypoint: python3 /groupbynode/main.py
    environment:
      - NODE_IND=0
      - NODE_COUNT=2
      - JOIN_NODE_COUNT=2
    networks:
      - testing_net
    depends_on:
      - middleware
    links:
      - middleware
    volumes:
      - ./groupbynode/config.ini:/config.ini:ro
      - ./.data/profiling/groupbynode1.prof:/etc/profiling/profile.prof
      - ./.data/states/:/etc/node_state

  groupbynode2:
    container_name: groupbynode2
    image: groupbynode:latest
    entrypoint: python3 /groupbynode/main.py
    environment:
      - NODE_IND=1
      - NODE_COUNT=2
      - JOIN_NODE_COUNT=2
    networks:
      - testing_net
    depends_on:
      - middleware
    links:
      - middleware
    volumes:
      - ./groupbynode/config.ini:/config.ini:ro
      - ./.data/profiling/groupbynode2.prof:/etc/profiling/profile.prof
      - ./.data/states/:/etc/node_state

  joinnode1:
    container_name: joinnode1
    image: joinnode:latest
    entrypoint: python3 /joinnode/main.py
    environment:
      - NODE_IND=0
      - NODE_COUNT=2
      - NODE_ID=0
    networks:
      - testing_net
    depends_on:
      - middleware
    links:
      - middleware
    volumes:
      - ./joinnode/config.ini:/config.ini:ro
      - ./.data/profiling/joinnode1.prof:/etc/profiling/profile.prof
      - ./.data/states/:/etc/node_state
  
  joinnode2:
    container_name: joinnode2
    image: joinnode:latest
    entrypoint: python3 /joinnode/main.py
    environment:
      - NODE_IND=1
      - NODE_COUNT=2
      - NODE_ID=0
    networks:
      - testing_net
    depends_on:
      - middleware
    links:
      - middleware
    volumes:
      - ./joinnode/config.ini:/config.ini:ro
      - ./.data/profiling/joinnode2.prof:/etc/profiling/profile.prof
      - ./.data/states/:/etc/node_state
      

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
